name: Release the Mac installer
on:
  push:
    tags: ['v3.*-mac.*', 'v*-metal-experimental.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the Apple silicon installer
        run: |
          installer=Longshot-Mac-Installer
          notes=native/docs/mac-release.md
          tag=
          case "$GITHUB_REF_NAME" in
            *-metal-experimental.*)
              installer=Longshot-Experimental-Installer
              notes=native/docs/mac-experimental.md
              tag="$GITHUB_REF_NAME"
              ;;
          esac
          native/scripts/mac/build_release_installer.sh HEAD:native "$installer" "$tag"
          lipo "$installer" -verify_arch arm64
          codesign --verify --strict "$installer"
          if [ "$(uname -m)" = arm64 ]; then "./$installer" --help; fi
          ditto -c -k --keepParent "$installer" "$installer.zip"
          shasum -a 256 "$installer.zip" > SHA256SUMS
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - name: Publish the signed installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$INSTALLER.zip" SHA256SUMS \
            --prerelease --verify-tag --title "Longshot for macOS $GITHUB_REF_NAME" --notes-file "$RELEASE_NOTES"
